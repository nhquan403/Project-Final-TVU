<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Nhà sàn Homestay TVH bên sông, hàng dừa và chiếc xuồng nhỏ">
<!--
  Ảnh nền trang chủ. Bốn điều chi phối cách vẽ tệp này:

  1. Trang chủ phủ lên nó một lớp tối 50% (bg-text/50 trong home.ts) để chữ
     trắng luôn đủ tương phản dù admin thay ảnh khác. Nên hình phải SÁNG và
     phải có sắc — một mảng gần trắng cộng lớp phủ tối ra đúng một mảng xám
     phẳng, trông như ảnh chưa tải xong.
  2. Thẻ <img> dùng object-cover, tức hình bị CẮT chứ không co lại. Ở khung
     1440px rộng, phần nhìn thấy là dải y≈100..800 của toạ độ trong tệp này.
     Mọi thứ đáng nhìn vì thế nằm gọn trong dải đó.
  3. Thẻ tìm phòng nằm CHÍNH GIỮA khung và che mất vùng trung tâm. Nhà sàn đặt
     lệch sang phải, hàng dừa sang trái, chừa giữa cho thẻ.
  4. Không có chữ trong hình. Tiêu đề là thẻ <h1> thật nằm đè lên trên; chữ vẽ
     trong SVG không phóng to theo thiết lập cỡ chữ của người dùng.
-->

<!-- Trời: ba dải đậm dần xuống chân trời, để lớp phủ tối không ra xám phẳng -->
<rect width="1600" height="900" fill="#D6E4EE"/>
<rect y="200" width="1600" height="200" fill="#E8F2F9"/>
<rect y="400" width="1600" height="160" fill="#F6FAFD"/>
<circle cx="1180" cy="214" r="96" fill="#FFFFFF" opacity="0.65"/>

<!-- Bờ xa: một đường đồi thấp, không phải một chùm hình tròn rời -->
<path d="M0 560V492c96-28 188-16 268 12s150 40 226 22 152-52 244-46 176 44 268 52 184-14 288-52 232-42 306-22v102z"
      fill="#7A8E9D" opacity="0.32"/>

<!-- Nhà sàn, đặt lệch phải để thẻ tìm phòng ở giữa không che -->
<g>
  <rect x="1082" y="546" width="16" height="104" fill="#075474"/>
  <rect x="1250" y="546" width="16" height="104" fill="#075474"/>
  <rect x="1046" y="528" width="256" height="20" fill="#075474"/>
  <rect x="1066" y="424" width="216" height="106" fill="#FFFFFF"/>
  <rect x="1066" y="424" width="216" height="106" fill="none" stroke="#D6E4EE" stroke-width="6"/>
  <rect x="1104" y="452" width="56" height="50" fill="#E8F2F9"/>
  <rect x="1192" y="452" width="56" height="50" fill="#E8F2F9"/>
  <polygon points="1036,424 1174,330 1312,424" fill="#075474"/>
  <polygon points="1174,330 1312,424 1284,424 1174,352" fill="#0A6C9E"/>
</g>

<!-- Dừa bên trái. Thân cong, tàu lá là bốn nhánh toả -->
<g fill="#075474">
  <path d="M236 566c-12-108 2-198 36-274l24 12c-28 74-42 160-32 262z"/>
  <ellipse cx="300" cy="298" rx="92" ry="21" transform="rotate(-24 300 298)"/>
  <ellipse cx="300" cy="298" rx="92" ry="21" transform="rotate(24 300 298)"/>
  <ellipse cx="300" cy="298" rx="84" ry="19" transform="rotate(-68 300 298)"/>
  <ellipse cx="300" cy="298" rx="84" ry="19" transform="rotate(68 300 298)"/>

  <path d="M446 566c-8-78 4-142 28-196l20 10c-20 52-30 114-24 186z"/>
  <ellipse cx="490" cy="376" rx="70" ry="17" transform="rotate(-22 490 376)"/>
  <ellipse cx="490" cy="376" rx="70" ry="17" transform="rotate(22 490 376)"/>
  <ellipse cx="490" cy="376" rx="64" ry="15" transform="rotate(-66 490 376)"/>
  <ellipse cx="490" cy="376" rx="64" ry="15" transform="rotate(66 490 376)"/>
</g>

<!-- Sông -->
<rect y="560" width="1600" height="340" fill="#0A6C9E"/>

<!-- Bóng đổ xuống nước: những dải ngang mờ dần, không phải một khối đặc -->
<g fill="#075474">
  <rect x="1066" y="560" width="216" height="26" opacity="0.55"/>
  <rect x="1074" y="594" width="200" height="20" opacity="0.42"/>
  <rect x="1086" y="622" width="176" height="16" opacity="0.30"/>
  <rect x="1100" y="646" width="148" height="12" opacity="0.20"/>
  <rect x="252" y="560" width="64" height="22" opacity="0.45"/>
  <rect x="258" y="590" width="52" height="16" opacity="0.30"/>
</g>

<!-- Gợn nước -->
<g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.26">
  <line x1="96" y1="634" x2="430" y2="634"/>
  <line x1="1340" y1="648" x2="1560" y2="648"/>
  <line x1="180" y1="712" x2="600" y2="712"/>
  <line x1="1020" y1="726" x2="1380" y2="726"/>
  <line x1="360" y1="796" x2="1120" y2="796"/>
  <line x1="1216" y1="852" x2="1520" y2="852"/>
</g>

<!-- Chiếc xuồng: điểm ấm duy nhất, cùng màu với giá tiền hiển thị trên trang -->
<g>
  <path d="M556 736h196l-28 36h-140z" fill="#C2410C"/>
  <rect x="646" y="690" width="7" height="46" fill="#C2410C"/>
  <polygon points="653,690 653,726 714,726" fill="#C2410C" opacity="0.7"/>
</g>
</svg>
