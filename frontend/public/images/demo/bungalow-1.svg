<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Bungalow ven sông">
<!--
  Bốn loại phòng nằm cạnh nhau trên cùng một lưới thẻ ở /phong và trang chủ.
  Ảnh này trước đây là tấm DUY NHẤT có nền kín màu đậm, nên trong lưới nó trông
  như một thẻ bị lỗi chứ không phải một loại phòng khác. Nền sáng, dải nước dồn
  xuống đáy — giống ba tấm còn lại.
-->
