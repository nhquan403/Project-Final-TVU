# nginx phục vụ bản Angular đã dựng và chuyển tiếp bốn nhóm đường dẫn sang API.
#
# BỐN nhóm, không phải một. /swagger-ui và /v3/api-docs KHÔNG nằm dưới /api;
# quên chúng thì chúng rơi vào `try_files ... /index.html` và trả về trang
# Angular với mã 200 — trông y như thành công, và tiêu chí "Swagger liệt kê đủ
# endpoint" không bao giờ đạt được mà không ai nhận ra.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Header bảo mật cho toàn site ────────────────────────────────────────
    # `always` là bắt buộc: thiếu nó, nginx bỏ header ở mọi phản hồi lỗi — tức
    # là đúng những phản hồi mà kẻ tấn công nhắm tới.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # CSP tối thiểu nhưng thật: Angular dựng sẵn không cần eval, ảnh có thể tới
    # từ chính site (uploads) hoặc data: (ảnh nội tuyến nhỏ), và QR của SePay
    # là ảnh từ tên miền ngoài nên phải khai tường minh.
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data: https://qr.sepay.vn https://res.cloudinary.com; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Bốn nhóm đường dẫn đi sang API ──────────────────────────────────────
    #
    # `^~` trên cả bốn là BẮT BUỘC, không phải trang trí. Khối `location ~*
    # \.(js|css|png|jpg|svg|...)$` ở cuối tệp là location CHÍNH QUY, mà nginx cho
    # location chính quy thắng mọi location tiền tố thường. Không có `^~`, một
    # đường dẫn như /uploads/abc.jpg rơi vào khối tĩnh đó, `try_files` không tìm
    # thấy tệp trong thư mục web và trả 404 — ảnh khách tải lên không bao giờ
    # hiện ra, mà nhật ký nginx trông hoàn toàn bình thường. `^~` bảo nginx
    # dừng lại ngay khi khớp tiền tố này, đừng xét tiếp biểu thức chính quy.
    #
    # `proxy_pass http://api:8080;` KHÔNG có dấu / ở cuối. Thêm dấu / vào là bảo
    # nginx thay thế phần tiền tố khớp bằng chuỗi rỗng, nên /api/health tới API
    # thành /health và mọi thứ trả 404.
    location ^~ /api {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location ^~ /swagger-ui {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Ảnh do người dùng tải lên. Hai header ở đây là phòng thủ theo chiều sâu:
    # backend đã giải mã lại ảnh và đổi tên tệp thành UUID, nhưng nếu một tệp
    # lạ lọt được vào thư mục này thì `nosniff` + CSP `sandbox` giữ cho trình
    # duyệt không thực thi nó như HTML trên chính tên miền của site.
    location ^~ /uploads {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    # ── Ứng dụng một trang ──────────────────────────────────────────────────
    # try_files là thứ khiến mở thẳng /phong/phong-doi-huong-vuon hoạt động.
    # Thiếu nó, F5 ở trang chi tiết trả 404 — mà F5 là thao tác bình thường,
    # không phải trường hợp hiếm.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tài nguyên có vân tay trong tên tệp thì đổi nội dung là đổi tên, nên cache
    # vĩnh viễn được. index.html thì KHÔNG: nó là chỗ duy nhất biết tên các tệp
    # kia, cache nó là ghim người dùng vào bản cũ sau mỗi lần triển khai.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
