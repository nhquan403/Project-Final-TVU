# Profile demo: dùng khi phát triển trên máy và cho bản docker compose đem đi
# bảo vệ. Chỉ có hai profile trong toàn dự án — demo và prod.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # KHÔNG khai `path`. Khai `path: /swagger-ui/index.html` (bản trước) làm
    # springdoc đăng ký một redirect ngay tại URL đó, che mất chính tệp
    # index.html của webjar, rồi chuyển hướng sang `/swagger-ui/swagger-ui/
    # index.html` — thừa một cấp. Bỏ thuộc tính này thì webjar được phục vụ
    # thẳng ở /swagger-ui/index.html, đúng URL mà SecurityConfig đã mở
    # (`/swagger-ui/**`) và đúng URL ghi trong tài liệu.

payments:
  simulator:
    # Endpoint mô phỏng chuyển khoản của Phase 6 cần CẢ ADMIN lẫn cờ này.
    # Mặc định tắt kể cả ở demo: bật thủ công khi cần trình diễn.
    enabled: false

logging:
  level:
    com.tvh.homestay: DEBUG
