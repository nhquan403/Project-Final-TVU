<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cần bổ sung thanh toán</title></head>
<body style="margin:0;padding:24px;background:#F9FAFB;font-family:Arial,Helvetica,sans-serif">
<div style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:12px;padding:28px">
    <h1 style="margin:0 0 8px;font-size:20px;color:#92400E">Số tiền nhận được chưa đủ</h1>
    <p style="margin:0 0 16px;font-size:15px;color:#1F2937">
        Chào <span th:text="${guestName}">Quý khách</span>, Homestay TVH đã nhận được
        <strong th:text="${amountReceived}">100.000 đ</strong> cho đơn
        <strong th:text="${code}">TVH000000</strong>, còn thiếu
        <strong th:text="${amountMissing}">410.000 đ</strong> so với tiền cọc.
    </p>

    <!--
      Nói rõ phòng vẫn được giữ và giữ tới khi nào. Không có câu này, khách đã
      chuyển tiền mà thấy đơn "chờ đối soát" sẽ tưởng mất tiền và chuyển thêm
      một lần nữa — đúng cái tình huống sinh ra hàng đợi đối soát.
    -->
    <p style="margin:0 0 16px;padding:12px 14px;background:#FEF3C7;border-radius:8px;font-size:14px;color:#78350F">
        Phòng của bạn <strong>vẫn đang được giữ</strong> tới
        <strong th:text="${holdExpiresAt}">00:00 01/01/2026</strong>. Vui lòng chuyển phần còn
        thiếu với đúng nội dung <strong th:text="${transferContent}">TVH00000001</strong>, hoặc liên
        hệ Homestay TVH để được hỗ trợ.
    </p>

    <div th:replace="~{mail/_fragments :: details}"></div>
    <div th:replace="~{mail/_fragments :: footer}"></div>
</div>
</body>
</html>
