<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Xác nhận đặt phòng</title></head>
<body style="margin:0;padding:24px;background:#F9FAFB;font-family:Arial,Helvetica,sans-serif">
<div style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:12px;padding:28px">
    <h1 style="margin:0 0 8px;font-size:20px;color:#166534">Đã nhận được tiền cọc</h1>
    <p style="margin:0 0 20px;font-size:15px;color:#1F2937">
        Chào <span th:text="${guestName}">Quý khách</span>, Homestay TVH đã nhận được tiền đặt cọc
        và <strong>xác nhận</strong> đơn đặt phòng của bạn. Vui lòng giữ lại thư này và đọc mã đơn
        khi nhận phòng.
    </p>

    <div th:replace="~{mail/_fragments :: details}"></div>

    <p style="margin:20px 0 0;font-size:14px;color:#1F2937">
        Nếu cần đổi ngày hoặc huỷ đơn, xin liên hệ trước ngày nhận phòng để được hỗ trợ.
    </p>

    <div th:replace="~{mail/_fragments :: footer}"></div>
</div>
</body>
</html>
